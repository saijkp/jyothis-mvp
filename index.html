<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jyothis | The Pure Light</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
        body { background: #000; color: #f0e68c; overflow: hidden; font-family: 'Georgia', serif; }
        
        #orb {
            width: 260px; height: 260px;
            background: radial-gradient(circle, #fff7ad 0%, #ffd700 20%, #ff8c00 50%, transparent 80%);
            border-radius: 50%; filter: blur(40px);
            transition: all 4s ease-in-out; opacity: 0.35;
        }

        .heartbeat { animation: heart 6s infinite ease-in-out; }
        @keyframes heart { 0%, 100% { transform: scale(0.95); opacity: 0.3; } 50% { transform: scale(1.05); opacity: 0.5; } }

        #sigil-display {
            letter-spacing: 0.8em; font-size: 11px; color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            margin-bottom: 20px; opacity: 0; transition: opacity 2s;
        }

        .incinerate { animation: burn 2.5s forwards ease-in; color: #fff; position: absolute; font-size: 1.5rem; font-style: italic; }
        @keyframes burn { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-400px) scale(0); filter: blur(20px); } }

        input { background: transparent; border: none; border-bottom: 1px solid rgba(255,215,0,0.1); color: #ffd700; text-align: center; width: 80%; font-size: 1.2rem; outline: none; user-select: text !important; transition: border 1s; }
        input:focus { border-bottom: 1px solid rgba(255,215,0,0.4); }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <div id="main-container" class="flex flex-col items-center justify-center w-full text-center px-6">
        
        <div id="orb" class="heartbeat cursor-pointer" onclick="resetAltar()"></div>
        
        <div id="interaction-zone" class="mt-16 w-full max-w-md">
            <div id="offering-area">
                <input type="text" id="altar-input" placeholder="Release into the fire..." onkeydown="if(event.key==='Enter') transform()">
            </div>

            <div id="oracle-box" class="hidden">
                <div id="sigil-display" class="uppercase"></div>
                <p id="oracle-text" class="italic text-yellow-100/80 text-lg leading-relaxed px-4"></p>
                <p class="mt-12 text-[8px] tracking-[0.4em] text-yellow-900/50 uppercase">Tap the Light to return</p>
            </div>
        </div>
    </div>

    <script>
        async function transform() {
            const input = document.getElementById('altar-input');
            const burden = input.value;
            if (!burden) return;

            const flame = document.createElement('div');
            flame.innerText = burden; flame.className = 'incinerate';
            document.body.appendChild(flame);
            
            input.value = '';
            document.getElementById('offering-area').style.opacity = "0";
            const orb = document.getElementById('orb');
            orb.classList.remove('heartbeat');
            orb.style.transform = "scale(1.2)"; orb.style.opacity = "0.8";

            try {
                const response = await fetch('/.netlify/functions/oracle', { method: 'POST', body: JSON.stringify({ burden }) });
                const data = await response.json();

                setTimeout(() => {
                    flame.remove();
                    orb.style.transform = "scale(0.8)"; orb.style.opacity = "0.2";
                    
                    document.getElementById('offering-area').classList.add('hidden');
                    document.getElementById('sigil-display').innerText = data.sigil;
                    document.getElementById('oracle-text').innerText = data.reply;
                    
                    document.getElementById('oracle-box').classList.remove('hidden');
                    setTimeout(() => { document.getElementById('sigil-display').style.opacity = "1"; }, 500);
                }, 2000);
            } catch (e) { console.error(e); }
        }

        function resetAltar() {
            if(document.getElementById('oracle-box').classList.contains('hidden')) return;
            document.getElementById('oracle-box').classList.add('hidden');
            document.getElementById('sigil-display').style.opacity = "0";
            document.getElementById('offering-area').classList.remove('hidden');
            document.getElementById('offering-area').style.opacity = "1";
            document.getElementById('orb').classList.add('heartbeat');
        }
    </script>
</body>
</html>
