<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jyothis | The Valley</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-touch-callout: none; -webkit-user-select: none;
            user-select: none; outline: none; -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body { background-color: #050505; color: #f0f0f0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        #static-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Static_noise.gif');
            opacity: 0.1; mix-blend-mode: screen; pointer-events: none;
        }

        /* The Orb - Optimized for Level 1 */
        #orb {
            width: 180px; height: 180px;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 40%, transparent 70%);
            border-radius: 50%; filter: blur(20px);
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.2; transform: scale(0.8);
        }

        .unlocked #orb {
            opacity: 0.8; transform: scale(0.6) translateY(-150px); /* Moves up to become header */
            filter: blur(10px);
        }

        /* Smoke Animation for Words */
        .smoke-away {
            animation: smoke 3s forwards ease-out;
            pointer-events: none;
        }

        @keyframes smoke {
            0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            100% { opacity: 0; transform: translateY(-100px) scale(2); filter: blur(20px); }
        }

        input {
            background: transparent; border-bottom: 1px solid #444;
            color: #ffd700; text-align: center; width: 100%;
            outline: none; padding: 10px; font-size: 1.2rem;
            user-select: text !important; /* Allow typing */
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <div id="static-overlay"></div>

    <div id="level-0" class="text-center z-10 transition-opacity duration-1000">
        <div class="relative flex items-center justify-center">
            <div id="orb" class="pulsing"></div>
        </div>
        <div id="instruction" class="mt-16 tracking-[0.3em] text-[10px] uppercase opacity-40">
            Hold the Light to Yield.
        </div>
        <div id="manifesto" class="hidden mt-10 p-6">
            <p class="italic text-yellow-100/60">"The valley spirit never dies."</p>
            <button onclick="enterLevel1()" class="mt-10 px-8 py-3 border border-yellow-700/50 text-yellow-600 text-[10px] tracking-[0.2em] uppercase">
                Begin Level 1
            </button>
        </div>
    </div>

    <div id="level-1" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-12 opacity-60 text-[10px] tracking-widest uppercase">
            Quest: The Intercept <br>
            <span id="counter" class="text-yellow-500">Progress: 0 / 3</span>
        </div>

        <div id="input-area" class="w-full max-w-xs">
            <p class="mb-4 text-sm text-gray-500 italic">What weight do you carry right now?</p>
            <input type="text" id="stressor-input" placeholder="..." onkeydown="if(event.key==='Enter') processWord()">
            <p class="mt-4 text-[9px] text-gray-600 uppercase tracking-tighter">Press Enter to dissolve</p>
        </div>

        <div id="level-complete" class="hidden text-yellow-500 animate-pulse">
            Level 1 Complete. <br> The Butterfly awaits.
        </div>
    </div>

    <script>
        let holdTimer;
        let intercepts = 0;
        const orb = document.getElementById('orb');
        const level0 = document.getElementById('level-0');
        const level1 = document.getElementById('level-1');
        const inputField = document.getElementById('stressor-input');

        // Stage 0: Handling the Hold
        function startHold(e) {
            if (e.cancelable) e.preventDefault();
            if (document.body.classList.contains('unlocked')) return;
            orb.style.transform = "scale(1.2)"; orb.style.opacity = "1";
            holdTimer = setTimeout(() => {
                document.getElementById('instruction').style.display = 'none';
                document.getElementById('manifesto').classList.remove('hidden');
            }, 3000);
        }

        function cancelHold() {
            if (document.body.classList.contains('unlocked')) return;
            clearTimeout(holdTimer);
            orb.style.transform = "scale(0.8)"; orb.style.opacity = "0.2";
        }

        // Stage 1: Transition to Dashboard
        function enterLevel1() {
            document.body.classList.add('unlocked');
            level0.classList.add('opacity-0');
            setTimeout(() => {
                level0.classList.add('hidden');
                level1.classList.remove('hidden');
            }, 1000);
        }

        // The "Alchemy": Dissolving the word
        function processWord() {
            const word = inputField.value;
            if (!word) return;

            // Create "Smoke" element
            const smoke = document.createElement('div');
            smoke.innerText = word;
            smoke.className = 'absolute text-xl text-yellow-500 smoke-away';
            document.body.appendChild(smoke);

            // Reset input and increment
            inputField.value = '';
            intercepts++;
            document.getElementById('counter').innerText = `Progress: ${intercepts} / 3`;

            if (intercepts >= 3) {
                document.getElementById('input-area').classList.add('hidden');
                document.getElementById('level-complete').classList.remove('hidden');
            }

            // Clean up smoke element
            setTimeout(() => smoke.remove(), 3000);
        }

        document.addEventListener('touchstart', startHold, { passive: false });
        document.addEventListener('touchend', cancelHold);
        document.addEventListener('mousedown', startHold);
        document.addEventListener('mouseup', cancelHold);
    </script>
</body>
</html>
